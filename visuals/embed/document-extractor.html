  --font-sans: -apple-system, system-ui, "Segoe UI", sans-serif;

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<body><div id="wf-doc" class="wf">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    .wf{--foreground:#111214;--muted-foreground:#555a63;--border:#e4e6ea;--muted:#f2f3f5;--primary:#e63946;--primary-foreground:#ffffff;--blue:#c1121f;--green:#1f8a4c;--orange:#b45309;--purple:#7c3aed;--red:#e63946;--card:#ffffff;--card-foreground:#111214;color:var(--foreground);font-family:'Inter','Segoe UI',system-ui,sans-serif;max-width:760px}
    .wf-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
    .wf-title{margin:0;font-size:20px;font-weight:500;font-family:'JetBrains Mono',monospace}
    .wf-badge{border-radius:999px;padding:2px 10px;font-size:12px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
    .wf-sub{margin:6px 0 14px;color:var(--muted-foreground);font-size:13px}
    .wf-rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .wf-chip{border:1px solid var(--border);background:transparent;color:var(--muted-foreground);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
    .wf-chip[aria-current="true"]{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
    .wf-stage{padding:14px 16px}
    .wf-iter{font-size:12px;color:var(--muted-foreground);margin-bottom:5px}
    .wf-thought{font-style:italic;color:var(--muted-foreground);margin-bottom:8px}
    .wf-action{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:12.5px;background:var(--muted);border-radius:6px;padding:7px 10px;margin-bottom:8px;word-break:break-word}
    .wf-action b{color:var(--blue)}
    .wf-obs{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:12px;background:var(--muted);border-radius:6px;padding:7px 10px;white-space:pre-wrap}
    .wf-verify{margin-top:8px;font-size:12.5px;border-radius:6px;padding:6px 10px}
    .wf-verify.ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
    .wf-verify.warn{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}
    .wf-controls{display:flex;align-items:center;gap:12px;margin-top:14px}
    .wf-counter{font-size:12.5px;color:var(--muted-foreground)}
    .wf-total{margin-top:10px;font-size:12px;color:var(--muted-foreground)}
  </style>
  <div class="wf-head">
    <h2 class="wf-title">Self-auditing document extractor</h2>
    <span class="wf-badge">2/2 invoices clean</span>
  </div>
  <p class="wf-sub">Extracts fields from invoices, audits the arithmetic, and fixes its own mistakes until every total and VAT figure validates. Real trace from a DeepSeek run.</p>
  <div class="wf-rail" id="wf-doc-rail" role="group" aria-label="steps"></div>
  <div class="wf-stage card" id="wf-doc-stage" role="region" aria-live="polite"></div>
  <div class="wf-controls">
    <button type="button" class="btn" id="wf-doc-prev">Previous</button>
    <span class="wf-counter" id="wf-doc-count"></span>
    <button type="button" class="btn btn-primary" id="wf-doc-next">Next step</button>
  </div>
  <p class="wf-total">Trace: real run on DeepSeek · 11 steps · success</p>
  <script>
  (function(){
    var root=document.getElementById('wf-doc');
    var DATA=[{"iteration":1,"thought":"I\u0027ll start by listing the available documents.","action":"list_docs","args":{},"observation":"invoice_1001.txt\ninvoice_1002.txt","verifier":"self-check: not every document has been extracted (0/2)","done":false},{"iteration":2,"thought":"Let\u0027s read the first document to understand its content.","action":"read_doc","args":{"name":"invoice_1001.txt"},"observation":"Invoice 1001\nDate: 2026-07-01\nCustomer: Acme Corp\nItems:\n- Widget A - 3 x $50.00 = $150.00\n- Widget B - 2 x $25.00 = $50.00\n- Shipping - 1 x $20.00 = $20.00\nTotal: $219.00\nVAT: 16% -\u003e $35.04\n","verifier":"self-check: not every document has been extracted (0/2)","done":false},{"iteration":3,"thought":"Now I\u0027ll extract the structured fields from this document.","action":"extract","args":{"name":"invoice_1001.txt"},"observation":"{\n  \"invoice\": \"1001\",\n  \"customer\": \"Acme Corp\",\n  \"line_items\": [\n    {\n      \"name\": \"Widget A\",\n      \"qty\": 3,\n      \"unit_price\": 50.0,\n      \"line_total\": 150.0\n    },\n    {\n      \"name\": \"Widget B\",\n      \"qty\": 2,\n      \"unit_price\": 25.0,\n      \"line_total\": 50.0\n    },\n    {\n      \"name\": \"Shipping\",\n      \"qty\": 1,\n      \"unit_price\": 20.0,\n      \"line_total\": 20.0\n    }\n  ],\n  \"total\": 219.0,\n  \"vat_rate\": 0.16,\n  \"vat_amount\": 35.04\n}","verifier":"self-check: not every document has been extracted (1/2)","done":false},{"iteration":4,"thought":"Let\u0027s validate the arithmetic consistency of this document.","action":"validate","args":{"name":"invoice_1001.txt"},"observation":"VALIDATION: invoice_1001.txt\n- total mismatch: expected 220.00, got 219.00\n- vat_amount mismatch: expected 35.20, got 35.04","verifier":"self-check: not every document has been extracted (1/2)","done":false},{"iteration":5,"thought":"The line items sum to 150+50+20=220, but total is 219. Also VAT should be 220*0.16=35.20. I\u0027ll fix the total and VAT amount.","action":"fix_field","args":{"name":"invoice_1001.txt","field":"total","value":"220.00"},"observation":"fixed invoice_1001.txt: total = 220.00","verifier":"self-check: not every document has been extracted (1/2)","done":false},{"iteration":6,"thought":"Now fix the VAT amount to 35.20.","action":"fix_field","args":{"name":"invoice_1001.txt","field":"vat_amount","value":"35.20"},"observation":"fixed invoice_1001.txt: vat_amount = 35.20","verifier":"self-check: not every document has been extracted (1/2)","done":false},{"iteration":7,"thought":"Let\u0027s validate again to confirm the fixes.","action":"validate","args":{"name":"invoice_1001.txt"},"observation":"VALIDATION CLEAN: invoice_1001.txt","verifier":"self-check: not every document has been extracted (1/2)","done":false},{"iteration":8,"thought":"First document passes. Now process the second document.","action":"read_doc","args":{"name":"invoice_1002.txt"},"observation":"Invoice 1002\nDate: 2026-07-02\nCustomer: Globex Ltd\nItems:\n- Gasket - 4 x $12.50 = $50.00\n- Bolt - 10 x $1.50 = $15.00\n- Labor - 1 x $45.00 = $45.00\nTotal: $110.00\nVAT: 16% -\u003e $17.00\n","verifier":"self-check: not every document has been extracted (1/2)","done":false},{"iteration":9,"thought":"Now extract the structured fields from this document.","action":"extract","args":{"name":"invoice_1002.txt"},"observation":"{\n  \"invoice\": \"1002\",\n  \"customer\": \"Globex Ltd\",\n  \"line_items\": [\n    {\n      \"name\": \"Gasket\",\n      \"qty\": 4,\n      \"unit_price\": 12.5,\n      \"line_total\": 50.0\n    },\n    {\n      \"name\": \"Bolt\",\n      \"qty\": 10,\n      \"unit_price\": 1.5,\n      \"line_total\": 15.0\n    },\n    {\n      \"name\": \"Labor\",\n      \"qty\": 1,\n      \"unit_price\": 45.0,\n      \"line_total\": 45.0\n    }\n  ],\n  \"total\": 110.0,\n  \"vat_rate\": 0.16,\n  \"vat_amount\": 17.0\n}","verifier":"self-check: validation errors -\u003e invoice_1002.txt - vat_amount mismatch: expected 17.60, got 17.00","done":false},{"iteration":10,"thought":"Validate the arithmetic consistency of this document.","action":"validate","args":{"name":"invoice_1002.txt"},"observation":"VALIDATION: invoice_1002.txt\n- vat_amount mismatch: expected 17.60, got 17.00","verifier":"self-check: validation errors -\u003e invoice_1002.txt - vat_amount mismatch: expected 17.60, got 17.00","done":false},{"iteration":11,"thought":"Line items sum to 50+15+45=110, total is correct. VAT should be 110*0.16=17.60, but got 17.00. Fix the VAT amount.","action":"fix_field","args":{"name":"invoice_1002.txt","field":"vat_amount","value":"17.60"},"observation":"fixed invoice_1002.txt: vat_amount = 17.60","verifier":"self-check: all documents pass arithmetic validation","done":true}];
    var idx=0;
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function fmtArgs(a){var s;try{s=JSON.stringify(a);}catch(e){s=String(a);}return s.length>220?s.slice(0,220)+'…':s;}
    function render(){
      var s=DATA[idx];
      var out='<div class="wf-iter">step '+(idx+1)+' of '+DATA.length+'</div>';
      out+='<div class="wf-thought">“'+esc(s.thought)+'”</div>';
      out+='<div class="wf-action"><b>'+esc(s.action)+'</b> '+esc(fmtArgs(s.args))+'</div>';
      if(s.observation){out+='<div class="wf-obs">'+esc(s.observation)+'</div>';}
      if(s.verifier){out+='<div class="wf-verify '+(s.done?'ok':'warn')+'">VERIFY · '+esc(s.verifier)+'</div>';}
      document.getElementById('wf-doc-stage').innerHTML=out;
      var rail=document.getElementById('wf-doc-rail');
      rail.innerHTML=DATA.map(function(d,j){var g=d.done?'✓':(d.verifier&&!d.done?'↻':'·');return '<button type="button" class="wf-chip" data-i="'+j+'" aria-current="'+(j===idx?'true':'false')+'"><span style="margin-right:5px">'+g+'</span>'+(j+1)+'</button>';}).join('');
      document.getElementById('wf-doc-count').textContent=(idx+1)+' / '+DATA.length;
      document.getElementById('wf-doc-prev').disabled=idx===0;
      document.getElementById('wf-doc-next').disabled=idx===DATA.length-1;
    }
    document.getElementById('wf-doc-prev').addEventListener('click',function(){if(idx>0){idx--;render();}});
    document.getElementById('wf-doc-next').addEventListener('click',function(){if(idx<DATA.length-1){idx++;render();}});
    document.getElementById('wf-doc-rail').addEventListener('click',function(e){var b=e.target.closest('.wf-chip');if(b){idx=Number(b.getAttribute('data-i'));render();}});
    render();
  })();
  </script>
</div>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
